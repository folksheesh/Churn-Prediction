# Render Blueprint – ChurnSense API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: churnsense-api
    runtime: python
    region: singapore   # closest to Indonesia
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random string
      - key: RENDER_EXTERNAL_URL
        value: "https://churn-prediction-jahv.onrender.com"
      # ── SMTP / Email (Gmail App Password) ──────────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: churnsense@gmail.com
      - key: SMTP_PASS
        sync: false   # Set this secret manually in the Render dashboard
    healthCheckPath: /health

