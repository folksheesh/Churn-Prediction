# Render Blueprint – ChurnSense API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: churnsense-api
    runtime: python
    region: singapore   # closest to Indonesia
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random string
      - key: RENDER_EXTERNAL_URL
        value: "https://churn-prediction-jahv.onrender.com"
      # ── Resend Email API ────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false   # Set this secret manually in the Render dashboard
      - key: RESEND_FROM
        value: "ChurnSense <noreply@churnsense.sbs>"
    healthCheckPath: /health

